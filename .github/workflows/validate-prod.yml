name: Validate Production Configuration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".firebaserc"
      - "firebase.json"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/validate-prod.yml"

permissions:
  contents: read

jobs:
  validate-prod-android:
    name: Build Prod Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install locked dependencies
        run: flutter pub get

      - name: Build production-flavor debug APK
        run: flutter build apk --debug --flavor prod -t lib/main_prod.dart
