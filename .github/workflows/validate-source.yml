name: Validate Flutter and Functions Source

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "functions/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/validate-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions-tests:
    name: Functions TypeScript and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
